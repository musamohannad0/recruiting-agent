{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>
<form method="post" action="/settings" style="max-width: 24rem">
  <label>Default minimum score on Matches page
    <input type="number" name="min_score_display" value="{{ min_score_display }}" min="0" max="100">
  </label>
  <button type="submit">Save</button>
</form>
<p class="muted">Models and schedules are configured in <code>.env</code> / <code>src/recruiting_agent/settings.py</code>.
Profile lives in <code>profile/resume.md</code> and <code>profile/profile.yaml</code> — edits trigger re-evaluation on the next match run.</p>
{% endblock %}
