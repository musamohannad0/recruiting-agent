<div class="status-btns">
  {% if user_status %}<span class="pill status-{{ user_status }}">{{ user_status }}</span>{% endif %}
  {% for value, label in [("saved", "Save"), ("applied", "Applied"), ("dismissed", "Dismiss"), ("new", "Reset")] %}
    {% if user_status != value and not (value == "new" and not user_status) %}
    <button type="button"
            aria-label="{{ label }}{% if role_name %} — {{ role_name }}{% endif %}"
            hx-post="/matches/{{ match_id }}/status"
            hx-vals='{"user_status": "{{ value }}"}'
            hx-target="#status-{{ match_id }}"
            hx-swap="innerHTML"
            data-pending-label="Saving">{{ label }}</button>
    {% endif %}
  {% endfor %}
</div>
