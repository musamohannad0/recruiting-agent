[project]
name = "recruiting-agent"
version = "0.1.0"
description = "Personal recruiting agent: tracks frontier companies, finds and scores matching roles"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "httpx>=0.28",
    "tenacity>=9.0",
    "typer>=0.15",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "markdownify>=0.13",
    "apscheduler>=3.10,<4",
    "claude-agent-sdk>=0.1.0",
    "langfuse>=3.0",
]

[project.optional-dependencies]
modal = [
    "modal>=1.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ra = "recruiting_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruiting_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
